<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · tdl Web GUI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232AABEE'/%3E%3Cpath d='M8 17l4 2 8-7-6 8 .5 4 2.5-3 5 2 2-14z' fill='white'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0f1420;
      color: #e6eaf2;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 380px;
      background: #171d2b;
      border: 1px solid #242c3d;
      border-radius: 14px;
      padding: 34px 30px 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
    }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 24px; }
    .brand-logo {
      width: 40px; height: 40px; border-radius: 9px;
      background: #2AABEE; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .brand-name { font-size: 17px; font-weight: 600; }
    .brand-name span { color: #8b97ad; font-weight: 400; }
    h1 { font-size: 19px; margin: 0 0 6px; font-weight: 600; }
    .sub { color: #8b97ad; font-size: 13px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; color: #a8b3c7; margin-bottom: 7px; }
    input {
      width: 100%; padding: 11px 13px; margin-bottom: 16px;
      background: #0f1420; border: 1px solid #2b3447; border-radius: 9px;
      color: #e6eaf2; font-size: 15px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #2AABEE; box-shadow: 0 0 0 3px rgba(42,171,238,.15); }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 9px;
      background: #2AABEE; color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button:hover:not(:disabled) { background: #1f96d4; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .msg {
      margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 13px; display: none; line-height: 1.5;
    }
    .msg.show { display: block; }
    .msg.err { background: rgba(240,80,80,.12); color: #ff8f8f; border: 1px solid rgba(240,80,80,.3); }
    .msg.ok { background: rgba(60,200,120,.12); color: #6ee7a8; border: 1px solid rgba(60,200,120,.3); }
    .foot {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid #242c3d;
      font-size: 12px; color: #6b7688; line-height: 1.6;
    }
    .locked { color: #ffb84d; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">TG</div>
      <div class="brand-name">tdl <span>Web GUI</span></div>
    </div>

    <h1>管理员登录</h1>
    <div class="sub">此控制台可操作 Telegram 账号，请先验证身份</div>

    <form id="login-form" autocomplete="on">
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username"
             required autofocus spellcheck="false">

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required>

      <button id="submit-btn" type="submit">登 录</button>
    </form>

    <div id="msg" class="msg"></div>

    <div class="foot">
      登录状态保持 12 小时。连续 5 次输错将临时锁定 15 分钟。
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var btn = document.getElementById('submit-btn');
      var msg = document.getElementById('msg');
      var userEl = document.getElementById('username');
      var passEl = document.getElementById('password');

      function show(text, kind) {
        msg.textContent = text;
        msg.className = 'msg show ' + (kind || 'err');
      }
      function hide() { msg.className = 'msg'; }

      // 已配置但未登录时正常显示；未配置则给明确提示
      fetch('/api/auth/status', { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (s) {
          if (s.authenticated) { location.replace('/'); return; }
          if (!s.configured) {
            show('管理员账号尚未设置。请先设置账号后再登录。', 'err');
            btn.disabled = true;
          }
        })
        .catch(function () { /* 忽略：直接让用户尝试登录 */ });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hide();

        var username = userEl.value.trim();
        var password = passEl.value;
        if (!username || !password) { show('请填写用户名和密码'); return; }

        btn.disabled = true;
        btn.textContent = '登录中…';

        fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
          .then(function (res) {
            if (res.status === 200 && res.data.ok) {
              show('登录成功，正在进入…', 'ok');
              location.replace('/');
              return;
            }
            passEl.value = '';
            show(res.data.message || '登录失败，请检查用户名和密码', 'err');
            btn.disabled = false;
            btn.textContent = '登 录';
          })
          .catch(function () {
            show('网络错误，请稍后重试', 'err');
            btn.disabled = false;
            btn.textContent = '登 录';
          });
      });
    })();
  </script>
</body>
</html>
